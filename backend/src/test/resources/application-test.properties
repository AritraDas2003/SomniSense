# Settings for the "test" profile. They are applied ON TOP of src/main/resources/application.properties
# whenever a test class is annotated with @ActiveProfiles("test").
# Purpose: automated tests use their own database so they can never touch somnisense_db.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/somnisense_test_db}

# Tests create their own users; never seed the admin from .env into the test database.
somnisense.bootstrap-admin.enabled=false

# Fixed ingestion key for tests only (not the developer's real key from .env).
somnisense.ingestion.api-key=test-ingestion-key-0123456789abcdef-0123456789

# Keep test logs readable.
spring.jpa.show-sql=false
