spring.application.name=somnisense-backend

# Local secrets: values in backend/.env (git-ignored) are loaded as if they were
# environment variables. Real OS environment variables still win if both are set.
# See .env.example for the list of variables. "optional:" means startup does not fail if .env is missing.
spring.config.import=optional:file:.env[.properties]

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/somnisense_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
# validate = Hibernate only CHECKS that entities match the tables; it never creates or changes them.
# The schema is owned by Flyway migrations in src/main/resources/db/migration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Store/read all timestamps in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Do not keep a DB connection open while the HTTP response is written (avoids hidden lazy-loading queries).
spring.jpa.open-in-view=false

# Session (login) cookie - decision 2026-11-21: server-side session, 60 min idle timeout.
server.servlet.session.timeout=${SESSION_TIMEOUT:60m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true when the app is served over HTTPS (cookies then only travel over HTTPS).
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Never put the session ID in URLs.
server.servlet.session.tracking-modes=cookie

# CORS - browser origins allowed to call the API with cookies (comma-separated, no wildcards).
somnisense.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Device freshness (decision 2026-11-21, 1 Hz stream): no data for >30 s = STALE, >120 s = DISCONNECTED.
somnisense.devices.stale-after=30s
somnisense.devices.disconnected-after=120s

# Reading ingestion (decision F8): shared key sent by the simulator / trusted gateway in X-Ingestion-Key.
# At least 32 characters, otherwise ingestion is disabled. Keep it in .env / environment, never in Git.
somnisense.ingestion.api-key=${INGESTION_API_KEY:}
# Ingestion clock tolerance (decision 2026-11-21): measuredAt may be up to 10 s ahead of the server clock and up to
# 10 s before the session start. (Batch size 1-600 is fixed in IngestReadingsRequest.)
somnisense.ingestion.clock-skew=10s

# Actuator - only the health endpoint is exposed, without internal details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging: show the request's correlation ID (set by CorrelationIdFilter) on every log line.
logging.pattern.level=%5p [cid:%X{correlationId:-}]

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Never allow Flyway to wipe the database.
spring.flyway.clean-disabled=true
